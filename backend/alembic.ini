# For the alembic CLI only (the app migrates itself at startup).
#
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "add machines"
#
# The database URL comes from ASD_DATABASE_URL / .env (see migrations/env.py).
[alembic]
script_location = src/acoustic_dashboard/db/migrations
file_template = %%(rev)s_%%(slug)s
